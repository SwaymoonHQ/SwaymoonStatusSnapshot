<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="/js/i18n-messages.js"></script>
  <script src="/js/i18n.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title data-i18n="history.title">历史</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/css/fonts.css" />
  <link rel="stylesheet" href="/css/developer-account.css" />
  <link rel="stylesheet" href="/css/status.css" />
</head>
<body>
  <div id="app-chrome"></div>
  <script src="/js/config.js"></script>
  <script src="/js/api-snapshot.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/snapshot-chrome.js"></script>
  <script src="/js/shell.js"></script>
  <script src="/js/history-bar.js"></script>
  <script>
    (function () {
      var Api = window.SwaymoonStatusApi;
      var Shell = window.SwaymoonStatusShell;
      var HistoryBar = window.SwaymoonHistoryBar;
      var t = Shell.t;
      var esc = Shell.esc;
      var main = Shell.mount({ active: 'history' });
      if (!main) return;
      document.title = t('history.title') + ' · ' + t('chrome.statusMonitor');
      var cfg = window.SwaymoonConfig || {};
      if (cfg.SNAPSHOT_MODE && window.SwaymoonSnapshotChrome) {
        main.innerHTML = '<div id="snapshot-banner-slot"></div><div id="history-page-body"></div>';
        window.SwaymoonSnapshotChrome.mountBanner('snapshot-banner-slot');
        main = document.getElementById('history-page-body');
      }
      Api.json('GET', '/api/v1/incidents?days=90').then(function (data) {
        var list = data.incidents || [];
        var listHtml = !list.length
          ? '<p class="dev-page-desc">' + esc(t('history.empty')) + '</p>'
          : list.map(function (inc) {
              var updates = (inc.updates || []).map(function (u) {
                return '<div class="incident-update">' +
                  '<div class="incident-meta"><strong>' + esc(t('inc.' + u.status) || u.status) + '</strong>' +
                  (u.createdAt ? ' · ' + esc(new Date(u.createdAt).toLocaleString()) : '') + '</div>' +
                  (u.body ? '<p class="incident-update-body">' + esc(u.body) + '</p>' : '') +
                  '</div>';
              }).join('');
              return '<article class="incident-card">' +
                '<h3><a class="incident-title-link" href="/incident.html?id=' + encodeURIComponent(inc.id) + '">' +
                esc(inc.title) + '</a></h3>' +
                '<div class="incident-meta">' +
                esc(t('severity.' + inc.severity) || inc.severity) + ' · ' +
                esc(t('inc.' + inc.status) || inc.status) +
                (inc.createdAt ? ' · ' + esc(new Date(inc.createdAt).toLocaleString()) : '') +
                (inc.resolvedAt ? ' → ' + esc(new Date(inc.resolvedAt).toLocaleString()) : '') +
                '</div>' +
                '<p class="rap-actions"><a class="btn-ghost" href="/incident.html?id=' + encodeURIComponent(inc.id) + '">' +
                esc(t('incident.viewDetail')) + '</a></p>' +
                updates + '</article>';
            }).join('');
        main.innerHTML =
          '<h1 class="dev-page-title">' + esc(t('history.title')) + '</h1>' +
          '<div id="history-bar-root"></div>' +
          listHtml;
        HistoryBar.mount(document.getElementById('history-bar-root'), { t: t, esc: esc, days: 7 });
      }).catch(function (err) {
        main.innerHTML = '<p class="dev-page-desc">' + esc(String(err.message || err)) + '</p>';
      });
    })();
  </script>
</body>
</html>
